name: Schema Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - dev-vini

jobs:
  schema-integrity:
    name: Supabase schema from Git
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase
        run: npm run db:start

      - name: Validate migrations from clean database
        run: npm run ci:schema

      - name: Check generated Supabase types
        run: |
          npx supabase gen types typescript --local > src/lib/supabase/database.types.generated.ts
          diff -u src/lib/supabase/database.types.ts src/lib/supabase/database.types.generated.ts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
